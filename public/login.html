<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Nearest Pharmacies and Toilets Map</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            height: 100%;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            background-image: url("images/img.jpg"); /* Use relative path */
            background-size: cover; /* Ensure it covers the entire screen */
            background-position: center; /* Center the image */
            background-repeat: no-repeat; /* Prevent repetition */
        }

        #login-container {
            background-color: pink;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 100%;
            max-width: 400px;
        }

        h2 {
            margin-bottom: 20px;
            color: #000000;
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-group input {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            border: 1px solid #000000;
            border-radius: 5px;
            margin-top: 5px;
        }

        .input-group input:focus {
            border-color: #000000;
            outline: none;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color:#000000;
            border: none;
            border-radius: 5px;
            color: white;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover {
            background-color: #000000;
        }

        .error-message {
            color: red;
            margin-top: 10px;
        }

    </style>
</head>
<body>

    <div id="login-container">
        <h2>Login</h2>
        <div class="input-group">
            <label for="email">Email:</label>
            <input type="email" id="email" placeholder="Enter your email" required>
        </div>

        <div class="input-group">
            <label for="password">Password:</label>
            <input type="password" id="password" placeholder="Enter your password" required>
        </div>

        <div class="error-message" id="error-message"></div>

        <button id="login-btn">Login</button>

        <footer>
            <p>&copy; 2024 Nearest Pharmacies and Toilets App. All Rights Reserved.</p>
        </footer>
    </div>

    <script>
        document.getElementById('login-btn').addEventListener('click', function() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorMessage = document.getElementById('error-message');

            if (!email || !password) {
                errorMessage.textContent = "Please fill in both fields!";
                return;
            }

            // Simulate a login process (you can replace this with actual authentication logic)
            if (email === 'jannwee@gmail.com' && password === 'HelloWorld') {
                localStorage.setItem('loggedIn', 'true');
                window.location.href = 'index.html';  // Redirect to main page (index.html)
            } else {
                errorMessage.textContent = "Invalid email or password!";
            }
        });
    </script>

</body>
</html>
